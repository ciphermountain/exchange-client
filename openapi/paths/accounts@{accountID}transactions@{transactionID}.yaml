paths:
  /accounts/{accountID}/transactions/{transactionID}:
    parameters:
      - $ref: '../components/parameters/Account.yaml#/AccountPathParam'
      - $ref: '../components/parameters/Transaction.yaml#/TransactionPathParam'
    get:
      description: Get details on a transaction item
      operationId: GetTransaction
      security:
        - OAuth2: [write]
      responses:
        200:
          $ref: '../components/responses/DataTransaction.yaml'
        404:
          $ref: '../components/responses/NotFoundError.yaml#/NotFoundError'
        500:
          $ref: '../components/responses/InternalServerError.yaml#/InternalServerError'
