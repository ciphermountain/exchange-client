PaymentOrderChainRequest:
  description: Request to create a new payment order chain. Transfer is optional and can be used to transfer funds from the last order in the chain. The transfer request symbol and amount must match the last order in the chain.
  type: object
  required:
  - orders
  properties:
    orders:
      type: array
      items:
        $ref: './Orders.yaml#/OrderRequest'
    transfer:
      $ref: './Transaction.yaml#/TransactionRequest'
LegStatus:
  type: string
  enum:
  - CHAIN_LEG_PENDING
  - CHAIN_LEG_QUEUED
  - CHAIN_LEG_FILLED
  - CHAIN_LEG_PARTIAL
  - CHAIN_LEG_CANCELLED
  - CHAIN_LEG_REJECTED
  - CHAIN_LEG_SKIPPED
PaymentOrderChainLegExecutionDetails:
  type: object
  required:
  - index
  - order_id
  - executed_avg_price
  - executed_quantity
  - executed_notional
  - slippage_bps_from_reference
  - status
  - completed_at
  properties:
    index:
      type: integer
      format: int32
    order_id:
      type: string
    executed_avg_price:
      type: string
    executed_quantity:
      type: string
    executed_notional:
      type: string
    slippage_bps_from_reference:
      type: string
    status:
      $ref: '#/LegStatus'
    completed_at:
      type: string
    rejection_reason:
      type: string
PaymentOrderChain:
  type: object
  required:
  - status
  - guid
  - orders
  properties:
    guid:
      type: string
    status:
      $ref: './Orders.yaml#/OrderStatus'
    orders:
      type: array
      items:
        $ref: '#/PaymentOrderChainLegExecutionDetails'
    transferID:
      type: string
